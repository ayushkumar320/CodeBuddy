services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codebuddy-postgres
    environment:
      POSTGRES_USER: codebuddy
      POSTGRES_PASSWORD: codebuddy
      POSTGRES_DB: codebuddy
    ports:
      - "5432:5432"
    volumes:
      - codebuddy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebuddy -d codebuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  codebuddy-postgres-data:
